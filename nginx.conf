server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite content-hashed files can be cached for one year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Personal photos/music may be replaced without renaming; keep cache short.
    # Missing media must return 404, never the SPA HTML fallback.
    location ~* \.(?:svg|png|jpe?g|webp|avif|gif|ico|mp3|m4a|ogg|wav|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
